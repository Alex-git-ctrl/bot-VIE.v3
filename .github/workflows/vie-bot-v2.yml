name: Bot Veille VIE v2
on:
  schedule:
  - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # nécessaire pour pusher seen_offers.json

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4 playwright playwright-stealth

      - name: Installer Playwright Chromium
        run: playwright install chromium

      - name: Lancer le bot
        env:
          GMAIL_ADDRESS:  ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          RECIPIENT:      ${{ secrets.RECIPIENT }}
        run: python vie_bot_v2.py

      - name: Sauvegarder seen_offers.json dans le repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_offers.json
          git diff --staged --quiet || git commit -m "chore: mise à jour seen_offers.json [skip ci]"
          git push
